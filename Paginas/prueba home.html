<!DOCTYPE html>
<html lang="en">
<head>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.Jr Signs</title>

<link rel="icon" type="image/png" href="../components/Logos/logo blanco.png">

<!-- Header styles -->
<link rel="stylesheet" href="../header/header.css">

<!-- Font Awesome -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>

/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ===== BODY ===== */
body{
    font-family:'Poppins',sans-serif;
    background-color:#000;
    background-repeat:repeat;
    background-size:contain;
    background-position:center;
    color:#fff;

    overflow-x:hidden;
}

/* overlay oscuro */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* ===== HEADER ===== */
#header-placeholder{
    margin:0 !important;
    padding:0 !important;
}

#header-placeholder *{
    margin-top:0 !important;
}

/* ===== HERO ===== */
.hero{

    min-height:100vh;

    width:100%;

    display:flex;
    align-items:center;

    background:
    linear-gradient(
        to right,
        rgba(0,0,0,.88) 0%,
        rgba(0,0,0,.65) 40%,
        rgba(0,0,0,.45) 100%
    ),
    url('/components/Images/banner.png');

    background-size:cover;
    background-repeat:no-repeat;
    background-position:center top 0px;

    margin:0;
    padding-top:0px;
    padding-bottom:80px;

    position:relative;

    overflow:hidden;
}

/* ===== CONTENIDO ===== */
.hero-content{
    width:90%;
    max-width:1200px;
    margin:auto;
    z-index:2;
}

/* ===== TITULO ===== */
.hero h1{

    font-size:48px;
    line-height:1.05;

    font-weight:700;

    max-width:500px;

    margin-bottom:30px;

    letter-spacing:1px;
}

/* linea roja */
.hero h1::before{

    content:"";
    display:block;

    width:120px;
    height:5px;

    background:#ff1e1e;

    margin-bottom:25px;

    border-radius:20px;
}

/* ===== TEXTO ===== */
.hero p{

    color:#d8d8d8;

    max-width:500px;

    font-size:17px;
    line-height:1.7;

    margin-bottom:45px;
}

/* ===== BOTONES ===== */
.hero-buttons{
    display:flex;
    gap:20px;
}

/* boton base */
.btn{

    padding:12px 34px;

    border-radius:8px;

    border:none;

    cursor:pointer;

    font-size:17px;
    font-weight:600;

    transition:.3s ease;
}

/* rojo */
.btn-primary{
    background:#ff1e1e;
    color:#fff;
}

.btn-primary:hover{
    background:#d10000;
    transform:translateY(-3px);
}

/* transparente */
.btn-outline{
    background:transparent;
    border:1px solid rgba(255,255,255,.8);
    color:#fff;
}

.btn-outline:hover{
    background:#fff;
    color:#000;
    transform:translateY(-3px);
}

/* ===== ICONOS HERO ===== */
.hero-icons{

    display:flex;

    gap:55px;

    margin-top:70px;

    flex-wrap:wrap;
}

/* item */
.hero-icon-card{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:18px;

    cursor:pointer;
}

/* contenedor SOLO del icono */
.hero-icon-image{

    width:95px;
    height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    transition:.3s ease;
}

/* hover SOLO en icono */
.hero-icon-card:hover .hero-icon-image{

    background:rgba(255,0,0,.12);

    box-shadow:
    0 0 15px rgba(255,0,0,.35),
    0 0 35px rgba(255,0,0,.15);

    transform:scale(1.08);
}

/* imagen */
.hero-icon-image img{

    width:178px;
    height:178px;

    object-fit:contain;
}

/* texto */
.hero-icon-card span{

    font-size:14px;

    font-weight:600;

    letter-spacing:1px;

    color:#fff;

    text-align:center;

    transition:.3s ease;
}

/* hover texto */
.hero-icon-card:hover span{

    color:#ff3a3a;
}

/* ===== MAIN ===== */
main{
    margin:0;
    padding:0;
}

/* ===== FOOTER ===== */
#footer-placeholder{
    margin:0;
    padding:0;
}

/* ===== BOTON SUBIR ===== */
.back-to-top{

    position:fixed;

    right:20px;
    top:50%;

    transform:translateY(-50%);

    font-size:32px;

    color:#ff1e1e;

    cursor:pointer;

    z-index:999;

    display:none;
}

.back-to-top.show{
    display:block;
}

.back-to-top i{
    animation:bounce 1.5s infinite;
}

@keyframes bounce{

    0%,20%,50%,80%,100%{
        transform:translateY(0);
    }

    40%{
        transform:translateY(-15px);
    }

    60%{
        transform:translateY(-8px);
    }
}

/* ===== RESPONSIVE ===== */
@media(max-width:1100px){

    .hero{

        background-size:cover;
        background-position:center;

        padding-top:150px;
    }

    .hero h1{
        font-size:56px;
    }
}

@media(max-width:768px){

    .hero{

        min-height:auto;

        padding-top:140px;
        padding-bottom:100px;

        background-size:cover;
        background-position:center;
    }

    .hero h1{

        font-size:42px;

        max-width:100%;
    }

    .hero p{

        font-size:17px;

        max-width:100%;
    }

    .hero-buttons{

        flex-direction:column;
        align-items:flex-start;
    }

    .btn{
        width:100%;
    }

    .hero-icons{

        justify-content:center;

        gap:25px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<!-- HERO -->
<section class="hero">

    <div class="hero-content">

        <h1>
            SEÑALIZACIÓN QUE
            IMPULSA TU MARCA
        </h1>

        <p>
            Creamos soluciones visuales que comunican,
            destacan y dejan huella.
        </p>

        <div class="hero-buttons">

            <button class="btn btn-primary">
                COTIZAR AHORA
            </button>

            <button class="btn btn-outline">
                VER SERVICIOS
            </button>

        </div>

        <!-- ===== ICONOS ===== -->
        <div class="hero-icons">

            <div class="hero-icon-card">

                <div class="hero-icon-image">
                    <img src="/components/Images/au.png" alt="About Us">
                </div>

                <span>ABOUT US</span>

            </div>

            <div class="hero-icon-card">

                <div class="hero-icon-image">
                    <img src="/components/Images/s.png" alt="Services">
                </div>

                <span>SERVICES</span>

            </div>

            <div class="hero-icon-card">

                <div class="hero-icon-image">
                    <img src="/components/Images/cu.png" alt="Contact Us">
                </div>

                <span>CONTACT US</span>

            </div>

            <div class="hero-icon-card">

                <div class="hero-icon-image">
                    <img src="/components/Images/glr.png" alt="Gallery">
                </div>

                <span>GALLERY</span>

            </div>

        </div>

    </div>

</section>

<!-- MAIN -->
<main></main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>

<!-- BOTÓN -->
<div class="back-to-top">
    <i class="fa fa-arrow-up"></i>
</div>

<script>

/* ===== HEADER ===== */
fetch("/Header/header.html")
.then(res => res.text())
.then(data => {

    document.getElementById("header-placeholder").innerHTML = data;

    const script = document.createElement("script");

    script.src = "../header/header.js";

    document.body.appendChild(script);
});

/* ===== FOOTER ===== */
fetch("../footer/footer.html")
.then(res => res.text())
.then(data => {

    document.getElementById("footer-placeholder").innerHTML = data;

    const link = document.createElement("link");

    link.rel = "stylesheet";
    link.href = "../footer/footer.css";

    document.head.appendChild(link);

    const script = document.createElement("script");

    script.src = "../footer/footer.js";

    document.body.appendChild(script);
});

/* ===== BOTON SCROLL ===== */
const backToTopBtn = document.querySelector(".back-to-top");

window.addEventListener("scroll", function(){

    if(window.scrollY > 200){
        backToTopBtn.classList.add("show");
    }else{
        backToTopBtn.classList.remove("show");
    }
});

backToTopBtn.addEventListener("click", function(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});

</script>

</body>
</html>
