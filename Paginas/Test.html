<!DOCTYPE html>
<html lang="en">
<head>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.Jr Signs</title>
<link rel="icon" type="image/png" href="../components/Logos/logo blanco.png">

<link rel="stylesheet" href="../header/header.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>

/* ===== MISMO FONDO ===== */

body{
margin:0;
padding:0;
font-family:'Open Sans',sans-serif;
min-height:100vh;
color:#fff;
background-color:#000;
background-image:url('/components/Images/bp.jpg');
background-repeat:repeat;
background-size:contain;
background-position:center;
position:relative;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
pointer-events:none;
z-index:-1;
}

@media screen and (max-width:768px){

body{
background-image:
linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
url('/components/fonts/10.jpeg') !important;

background-repeat:repeat;
background-size:contain;
background-position:center;
background-color:#000 !important;
}

body::before{
display:none !important;
}

}

/* ===== GALERIA ===== */

.gallery-section{
padding:80px 10%;
}

.gallery-title{
text-align:center;
color:white;
font-size:36px;
margin-bottom:60px;
letter-spacing:3px;
font-family:'Poppins',sans-serif;
font-style:italic;
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:50px;
}

/* ===== CARD ===== */

.gallery-card{
background:#00000000;
border-radius:10px;
overflow:hidden;
transition:transform .3s;
}

/* ===== IMAGENES ===== */

.preview-main img{
width:100%;
height:260px;
object-fit:cover;
display:block;
transition:transform .4s ease;
}

.preview-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.preview-row img{
width:100%;
height:140px;
object-fit:cover;
display:block;
transition:transform .4s ease;
}

/* hover imagen */

.gallery-card img:hover{
transform:scale(1.05) translateY(-4px);
}

/* ===== OVERLAY ===== */

.overlay{
padding:15px 25px 25px 25px;
text-align:center;
background:#00000000;
}

.overlay h3{
font-size:20px;
margin-bottom:10px;
}

/* ===== BOTON NEON BASE ===== */

.overlay button{
background:transparent;
padding:10px 28px;
font-size:12px;
letter-spacing:2px;
cursor:pointer;
border-radius:4px;
transition:all .3s ease;
}

/* ===== NEON 1 ROJO ===== */

.neon-red button{
color:#ff2a2a;
border:2px solid #ff2a2a;
box-shadow:0 0 8px #ff2a2a;
}

.neon-red button:hover{
background:#ff2a2a;
color:black;
box-shadow:
0 0 10px #ff2a2a,
0 0 20px #ff2a2a,
0 0 40px #ff2a2a;
}

/* ===== NEON 2 BLANCO ===== */

.neon-white button{
color:white;
border:2px solid white;
box-shadow:0 0 8px white;
}

.neon-white button:hover{
background:white;
color:black;
box-shadow:
0 0 10px white,
0 0 25px white;
}

/* ===== NEON 3 NEGRO/ROJO ===== */

.neon-dark button{
color:white;
border:2px solid #ff2a2a;
box-shadow:0 0 8px #ff2a2a inset;
}

.neon-dark button:hover{
background:black;
color:#ff2a2a;
box-shadow:
0 0 10px #ff2a2a,
0 0 25px #ff2a2a;
}

/* ===== RESPONSIVE ===== */

@media(max-width:900px){
.gallery-grid{
grid-template-columns:1fr;
}
}

/* ===== FLECHA ===== */

.back-to-top{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
font-size:32px;
color:red;
cursor:pointer;
z-index:999;
display:none;
}

.back-to-top.show{
display:block;
}

</style>
</head>

<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<section class="gallery-section">

<h2 class="gallery-title">GALLERY</h2>

<div class="gallery-grid">


<!-- CATEGORY 1 -->

<div class="gallery-card neon-red">

<div class="preview-main">
<img src="https://picsum.photos/800/500?1">
</div>

<div class="preview-row">
<img src="https://picsum.photos/400/300?2">
<img src="https://picsum.photos/400/300?3">
</div>

<div class="overlay">
<h3>CUSTOM SIGN FABRICATION</h3>
<button>VIEW GALLERY</button>
</div>

</div>


<!-- CATEGORY 2 -->

<div class="gallery-card neon-white">

<div class="preview-main">
<img src="https://picsum.photos/800/500?4">
</div>

<div class="preview-row">
<img src="https://picsum.photos/400/300?5">
<img src="https://picsum.photos/400/300?6">
</div>

<div class="overlay">
<h3>VEHICLE WRAPS & FLEET GRAPHICS</h3>
<button>VIEW GALLERY</button>
</div>

</div>


<!-- CATEGORY 3 -->

<div class="gallery-card neon-dark">

<div class="preview-main">
<img src="https://picsum.photos/800/500?7">
</div>

<div class="preview-row">
<img src="https://picsum.photos/400/300?8">
<img src="https://picsum.photos/400/300?9">
</div>

<div class="overlay">
<h3>ARCHITECTURAL GRAPHICS</h3>
<button>VIEW GALLERY</button>
</div>

</div>


<!-- CATEGORY 4 -->

<div class="gallery-card neon-red">

<div class="preview-main">
<img src="https://picsum.photos/800/500?10">
</div>

<div class="preview-row">
<img src="https://picsum.photos/400/300?11">
<img src="https://picsum.photos/400/300?12">
</div>

<div class="overlay">
<h3>ILLUMINATED & LED SIGNAGE</h3>
<button>VIEW GALLERY</button>
</div>

</div>


<!-- CATEGORY 5 -->

<div class="gallery-card neon-white">

<div class="preview-main">
<img src="https://picsum.photos/800/500?13">
</div>

<div class="preview-row">
<img src="https://picsum.photos/400/300?14">
<img src="https://picsum.photos/400/300?15">
</div>

<div class="overlay">
<h3>CHANNEL LETTERS</h3>
<button>VIEW GALLERY</button>
</div>

</div>


<!-- CATEGORY 6 -->

<div class="gallery-card neon-dark">

<div class="preview-main">
<img src="https://picsum.photos/800/500?16">
</div>

<div class="preview-row">
<img src="https://picsum.photos/400/300?17">
<img src="https://picsum.photos/400/300?18">
</div>

<div class="overlay">
<h3>LARGE FORMAT PRINTING</h3>
<button>VIEW GALLERY</button>
</div>

</div>


</div>
</section>


<!-- FOOTER -->
<div id="footer-placeholder"></div>


<!-- FLECHA -->
<div class="back-to-top">
<i class="fa fa-arrow-up"></i>
</div>


<script>

/* HEADER */

fetch("/Header/header.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("header-placeholder").innerHTML=data

const script=document.createElement("script")
script.src="../header/header.js"
document.body.appendChild(script)
})

/* FOOTER */

fetch("../footer/footer.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("footer-placeholder").innerHTML=data

const link=document.createElement("link")
link.rel="stylesheet"
link.href="../footer/footer.css"
document.head.appendChild(link)

const script=document.createElement("script")
script.src="../footer/footer.js"

script.onload=()=>{
if(typeof initFooterForm==="function") initFooterForm()
}

document.body.appendChild(script)

})

/* BOTON ARRIBA */

const backToTopBtn=document.querySelector(".back-to-top")

window.addEventListener("scroll",function(){

if(window.scrollY>200){
backToTopBtn.classList.add("show")
}else{
backToTopBtn.classList.remove("show")
}

})

backToTopBtn.addEventListener("click",function(){
window.scrollTo({top:0,behavior:"smooth"})
})

window.onbeforeunload=()=>window.scrollTo(0,0)

</script>

</body>
</html>
